name: digi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    
    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4
    
    - name: 🐍 Python ve FFmpeg Kurulumu
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg python3
    
    - name: 🚀 Yayını Başlat
      run: |
        python bot.py

    - name: 🔄 Otomatik Yeniden Başlat
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔄 Yayın sonlandı veya iptal edildi, yeni bir GitHub Actions döngüsü tetikleniyor..."
        
        # GitHub CLI ile kimlik doğrulama yap ve yeni workflow'u tetikle
        echo "${GITHUB_TOKEN}" | gh auth login --with-token
        gh workflow run digi --ref main
        
        echo "✅ Yeni döngü başarıyla başlatıldı!"
